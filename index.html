<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Photobooth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fec3ca;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Candy decorations */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-circle(circle at 20% 80%, #d6e8b5 0%, transparent 50%),
                radial-circle(circle at 80% 20%, #ffffff 0%, transparent 50%),
                radial-circle(circle at 40% 40%, #d6e8b5 0%, transparent 50%);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 
                0 8px 0 #d6a0a6,
                0 16px 30px rgba(0,0,0,0.2);
            max-width: 1400px;
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 4px solid #fec3ca;
        }

        .header {
            background: #fec3ca;
            padding: 30px 20px;
            text-align: center;
            color: white;
            border-bottom: 4px solid #d6a0a6;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5em;
            text-shadow: 
                3px 3px 0 #d6a0a6,
                5px 5px 10px rgba(0,0,0,0.2);
            color: white;
        }

        .main-content {
            display: flex;
            gap: 20px;
            padding: 20px;
            min-height: 600px;
            background: #fff8f9;
        }

        .camera-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .photo-count {
            background: #d6e8b5;
            color: #5a7a3c;
            padding: 15px 25px;
            border-radius: 30px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2em;
            box-shadow: 
                0 6px 0 #b8ca97,
                0 10px 20px rgba(0,0,0,0.15);
            border: 3px solid #fff;
            transform: translateY(0);
            transition: all 0.2s ease;
        }

        .photo-count:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 #b8ca97,
                0 12px 25px rgba(0,0,0,0.2);
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 25px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid #fec3ca;
            box-shadow: 
                0 8px 0 #d6a0a6,
                0 15px 30px rgba(0,0,0,0.2);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            display: none;
        }

        .photo-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: #fec3ca;
            font-weight: bold;
            font-family: 'Fredoka One', cursive;
            text-shadow: 
                4px 4px 0 #d6e8b5,
                8px 8px 20px rgba(0,0,0,0.4);
            z-index: 10;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9;
        }

        .flash.active {
            animation: flash 0.3s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
            border: 3px solid white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #fec3ca;
            color: white;
            box-shadow: 
                0 6px 0 #d6a0a6,
                0 10px 20px rgba(254, 195, 202, 0.4);
            transform: translateY(0);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 9px 0 #d6a0a6,
                0 13px 25px rgba(254, 195, 202, 0.5);
        }

        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 
                0 3px 0 #d6a0a6,
                0 5px 10px rgba(254, 195, 202, 0.3);
        }

        .btn-secondary {
            background: #d6e8b5;
            color: #5a7a3c;
            box-shadow: 
                0 6px 0 #b8ca97,
                0 10px 20px rgba(214, 232, 181, 0.4);
            transform: translateY(0);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 9px 0 #b8ca97,
                0 13px 25px rgba(214, 232, 181, 0.5);
        }

        .btn-secondary:active {
            transform: translateY(3px);
            box-shadow: 
                0 3px 0 #b8ca97,
                0 5px 10px rgba(214, 232, 181, 0.3);
        }

        .btn-success {
            background: #d6e8b5;
            color: #5a7a3c;
            box-shadow: 
                0 6px 0 #b8ca97,
                0 10px 20px rgba(214, 232, 181, 0.4);
            transform: translateY(0);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 9px 0 #b8ca97,
                0 13px 25px rgba(214, 232, 181, 0.5);
        }

        .btn-success:active {
            transform: translateY(3px);
            box-shadow: 
                0 3px 0 #b8ca97,
                0 5px 10px rgba(214, 232, 181, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateY(0) !important;
            box-shadow: 
                0 3px 0 #ccc,
                0 5px 10px rgba(0,0,0,0.2) !important;
        }

        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 25px;
            border: 3px solid #fec3ca;
            background: white;
            color: #fec3ca;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 700;
            box-shadow: 
                0 4px 0 #d6a0a6,
                0 6px 15px rgba(0,0,0,0.1);
            transform: translateY(0);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0 #d6a0a6,
                0 8px 20px rgba(0,0,0,0.15);
        }

        .filter-btn.active {
            background: #fec3ca;
            color: white;
            transform: translateY(2px);
            box-shadow: 
                0 2px 0 #d6a0a6,
                0 4px 10px rgba(0,0,0,0.1);
        }

        .sticker-panel {
            width: 300px;
            background: #fff8f9;
            border-radius: 25px;
            padding: 20px;
            overflow-y: auto;
            max-height: 600px;
            border: 4px solid #d6e8b5;
            box-shadow: 
                0 6px 0 #b8ca97,
                0 10px 25px rgba(0,0,0,0.15);
        }

        .sticker-panel h3 {
            margin-bottom: 15px;
            color: #fec3ca;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0 #d6e8b5;
            font-size: 1.5em;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .sticker-item {
            width: 100%;
            aspect-ratio: 1;
            background: white;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid #d6e8b5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 4px 0 #b8ca97,
                0 6px 15px rgba(0,0,0,0.1);
            transform: translateY(0);
        }

        .sticker-item:hover {
            transform: translateY(-3px) scale(1.05);
            border-color: #fec3ca;
            box-shadow: 
                0 7px 0 #d6a0a6,
                0 10px 20px rgba(0,0,0,0.15);
        }

        .sticker-item:active {
            transform: translateY(2px) scale(1);
            box-shadow: 
                0 2px 0 #b8ca97,
                0 4px 10px rgba(0,0,0,0.1);
        }

        .sticker-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sticker-overlay {
            position: absolute;
            cursor: move;
            z-index: 5;
        }

        .sticker-overlay img {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sticker-controls {
            position: absolute;
            top: -30px;
            right: -30px;
            display: flex;
            gap: 5px;
        }

        .sticker-control-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 
                0 3px 0 #d6a0a6,
                0 5px 10px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        .sticker-control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 5px 0 #d6a0a6,
                0 7px 15px rgba(0,0,0,0.3);
        }

        .delete-sticker {
            background: #fec3ca;
            color: white;
        }

        .resize-handle {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background: #d6e8b5;
            border-radius: 50%;
            cursor: nwse-resize;
            border: 3px solid white;
            box-shadow: 
                0 3px 0 #b8ca97,
                0 5px 10px rgba(0,0,0,0.2);
        }

        .strip-preview {
            background: #fff8f9;
            padding: 40px;
            border-radius: 25px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .strip-preview.active {
            display: flex;
        }

        #stripCanvas {
            border: 5px solid #fec3ca;
            border-radius: 20px;
            max-width: 100%;
            box-shadow: 
                0 10px 0 #d6a0a6,
                0 20px 40px rgba(0,0,0,0.2);
        }

        .hidden {
            display: none !important;
        }

        .start-screen {
            text-align: center;
            padding: 80px 40px;
            background: #fff8f9;
        }

        .start-screen h2 {
            color: #fec3ca;
            font-family: 'Fredoka One', cursive;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 
                3px 3px 0 #d6e8b5,
                6px 6px 15px rgba(0,0,0,0.1);
        }

        .start-screen p {
            color: #5a7a3c;
            font-size: 1.3em;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .welcome-icon {
            font-size: 100px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .cute-hearts {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 40px;
        }

        .cute-hearts span {
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .cute-hearts span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .cute-hearts span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .sticker-panel {
                width: 100%;
                max-height: 400px;
                order: 2;
            }

            .camera-section {
                order: 1;
            }

            .header h1 {
                font-size: 2em;
            }

            .start-screen h2 {
                font-size: 2em;
            }

            .start-screen p {
                font-size: 1.1em;
            }

            button {
                padding: 12px 25px;
                font-size: 0.95em;
            }

            .filters {
                overflow-x: auto;
                justify-content: flex-start;
                padding-bottom: 10px;
            }

            .filter-btn {
                flex-shrink: 0;
            }

            .controls {
                flex-direction: column;
                width: 100%;
            }

            .controls button {
                width: 100%;
            }

            .sticker-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .photo-count {
                font-size: 1em;
                padding: 12px 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 20px;
            }

            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .main-content {
                padding: 15px;
                gap: 15px;
            }

            .start-screen {
                padding: 40px 20px;
            }

            .start-screen h2 {
                font-size: 1.6em;
            }

            .cute-hearts {
                font-size: 30px;
            }

            .strip-preview {
                padding: 20px;
            }

            #stripCanvas {
                max-width: 100%;
                height: auto;
            }
        }

        /* Landscape mode on mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            .camera-container {
                aspect-ratio: 16/9;
            }

            .main-content {
                min-height: auto;
            }

            .start-screen {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cute Photobooth</h1>
        </div>

        <div class="start-screen" id="startScreen">
            <div class="cute-hearts">
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
            </div>
            <h2>Welcome to My Cute Photobooth!</h2>
            <p>Get ready to capture 4 adorable photos with fun stickers</p>
            <button class="btn-primary" onclick="startPhotobooth()">Start Photobooth</button>
        </div>

        <div class="main-content hidden" id="mainContent">
            <div class="camera-section">
                <div class="photo-count" id="photoCount">Photo 1 of 4</div>
                
                <div class="filters" id="filterSection">
                    <button class="filter-btn active" onclick="applyFilter('none')">Normal</button>
                    <button class="filter-btn" onclick="applyFilter('grayscale')">B&W</button>
                    <button class="filter-btn" onclick="applyFilter('sepia')">Sepia</button>
                    <button class="filter-btn" onclick="applyFilter('vintage')">Vintage</button>
                </div>

                <div class="camera-container" id="cameraContainer">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div class="flash" id="flash"></div>
                    <div id="stickerContainer"></div>
                </div>

                <div class="controls">
                    <button class="btn-primary" id="captureBtn" onclick="startCountdown()">
                        Capture Photo
                    </button>
                    <button class="btn-secondary hidden" id="retakeBtn" onclick="retakePhoto()">
                        Retake
                    </button>
                    <button class="btn-success hidden" id="nextBtn" onclick="nextPhoto()">
                        Next Photo
                    </button>
                    <button class="btn-success hidden" id="finishBtn" onclick="finishStrip()">
                        Finish & Preview
                    </button>
                </div>
            </div>

            <div class="sticker-panel">
                <h3>Add Stickers</h3>
                <p style="color: #5a7a3c; font-size: 0.9em; margin-bottom: 15px; font-weight: 600;">
                    Click to add, drag to move, use handle to resize
                </p>
                <div class="sticker-grid" id="stickerGrid">
                </div>
            </div>
        </div>

        <div class="strip-preview" id="stripPreview">
            <h2 style="color: #fec3ca; font-family: 'Fredoka One', cursive; text-shadow: 3px 3px 0 #d6e8b5;">Your Photo Strip!</h2>
            <div class="strip-container" style="position: relative; display: inline-block;">
                <canvas id="stripCanvas"></canvas>
                <div id="stripStickerContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
            </div>
            <div class="sticker-panel" style="max-height: 300px; width: 100%; max-width: 500px;">
                <h3>Customize Your Strip</h3>
                <p style="color: #5a7a3c; font-size: 0.9em; margin-bottom: 15px; font-weight: 600;">
                    Add stickers to your photo strip!
                </p>
                <div class="sticker-grid" id="stripStickerGrid">
                </div>
            </div>
            <div class="controls">
                <button class="btn-primary" onclick="downloadStripWithStickers()">
                    Download Strip
                </button>
                <button class="btn-secondary" onclick="startOver()">
                    Start Over
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let stream = null;
        let currentPhotoIndex = 0;
        let photos = [];
        let currentFilter = 'none';
        let stickerCounter = 0;
        let activeSticker = null;
        let stripStickerCounter = 0;

        // ========================================
        // IMPORTANT: ADD YOUR PINTEREST STICKER URLS HERE!
        // ========================================
        // Replace these placeholder URLs with your downloaded Pinterest stickers
        // You can add as many stickers as you want!
        const stickerUrls = [
            // Example format:
            // 'path/to/your/sticker1.png',
            // 'path/to/your/sticker2.png',
            // Or if hosted online:
            // 'https://example.com/sticker1.png',
            
            // Placeholder stickers (replace these with your own):
            'stickers/bow.png', // heart
            'stickers/bunny.png', // star
            'stickers/camera.png', // sunglasses
            'stickers/disco.png', // crown
            'stickers/flower.png', // smile
            'stickers/headphone.png', // kiss
            'stickers/sony.png', // sparkle
            'stickers/star_sticker.png', // fire
            'https://cdn-icons-png.flaticon.com/512/3468/3468071.png', // confetti
        ];

        // Initialize sticker grids
        function loadStickers() {
            const grid = document.getElementById('stickerGrid');
            const stripGrid = document.getElementById('stripStickerGrid');
            grid.innerHTML = '';
            stripGrid.innerHTML = '';
            
            stickerUrls.forEach((url, index) => {
                // Camera stickers
                const item = document.createElement('div');
                item.className = 'sticker-item';
                item.innerHTML = `<img src="${url}" alt="Sticker ${index + 1}">`;
                item.onclick = () => addSticker(url);
                grid.appendChild(item);

                // Strip stickers
                const stripItem = document.createElement('div');
                stripItem.className = 'sticker-item';
                stripItem.innerHTML = `<img src="${url}" alt="Sticker ${index + 1}">`;
                stripItem.onclick = () => addStripSticker(url);
                stripGrid.appendChild(stripItem);
            });
        }

        // Start photobooth
        async function startPhotobooth() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                document.getElementById('video').srcObject = stream;
                loadStickers();
            } catch (err) {
                alert('Unable to access camera. Please grant camera permissions.');
                console.error(err);
            }
        }

        // Apply filter
        function applyFilter(filter) {
            currentFilter = filter;
            const video = document.getElementById('video');
            const filterBtns = document.querySelectorAll('.filter-btn');
            
            filterBtns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            switch(filter) {
                case 'grayscale':
                    video.style.filter = 'grayscale(100%)';
                    break;
                case 'sepia':
                    video.style.filter = 'sepia(100%)';
                    break;
                case 'vintage':
                    video.style.filter = 'sepia(50%) contrast(1.2) brightness(0.9)';
                    break;
                default:
                    video.style.filter = 'none';
            }
        }

        // Countdown and capture
        function startCountdown() {
            const container = document.getElementById('cameraContainer');
            const captureBtn = document.getElementById('captureBtn');
            captureBtn.disabled = true;
            
            let count = 3;
            const countdownEl = document.createElement('div');
            countdownEl.className = 'countdown';
            countdownEl.textContent = count;
            container.appendChild(countdownEl);
            
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else {
                    clearInterval(interval);
                    countdownEl.remove();
                    capturePhoto();
                }
            }, 1000);
        }

        // Capture photo
        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const flash = document.getElementById('flash');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Flash effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 300);
            
            // Draw video frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Apply filter to canvas
            if (currentFilter !== 'none') {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                applyCanvasFilter(imageData, currentFilter);
                ctx.putImageData(imageData, 0, 0);
            }
            
            // Draw stickers onto canvas
            const stickers = document.querySelectorAll('.sticker-overlay');
            stickers.forEach(sticker => {
                const img = sticker.querySelector('img');
                const rect = sticker.getBoundingClientRect();
                const containerRect = document.getElementById('cameraContainer').getBoundingClientRect();
                
                // Calculate position and size relative to canvas
                const scaleX = canvas.width / containerRect.width;
                const scaleY = canvas.height / containerRect.height;
                
                const x = (rect.left - containerRect.left) * scaleX;
                const y = (rect.top - containerRect.top) * scaleY;
                const width = rect.width * scaleX;
                const height = rect.height * scaleY;
                
                // Get rotation
                const transform = sticker.style.transform;
                const rotateMatch = transform.match(/rotate\(([^)]+)\)/);
                const rotation = rotateMatch ? parseFloat(rotateMatch[1]) : 0;
                
                ctx.save();
                ctx.translate(x + width/2, y + height/2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.drawImage(img, -width/2, -height/2, width, height);
                ctx.restore();
            });
            
            // Save photo
            photos[currentPhotoIndex] = {
                dataUrl: canvas.toDataURL('image/png'),
                filter: currentFilter
            };
            
            // Update UI
            video.style.display = 'none';
            canvas.style.display = 'block';
            canvas.className = 'photo-preview';
            
            document.getElementById('captureBtn').classList.add('hidden');
            document.getElementById('retakeBtn').classList.remove('hidden');
            
            if (currentPhotoIndex < 3) {
                document.getElementById('nextBtn').classList.remove('hidden');
            } else {
                document.getElementById('finishBtn').classList.remove('hidden');
            }
            
            // Clear stickers
            document.getElementById('stickerContainer').innerHTML = '';
        }

        // Apply filter to canvas image data
        function applyCanvasFilter(imageData, filter) {
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                if (filter === 'grayscale') {
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    data[i] = data[i + 1] = data[i + 2] = gray;
                } else if (filter === 'sepia') {
                    data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                } else if (filter === 'vintage') {
                    const sepia_r = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    const sepia_g = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    const sepia_b = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                    data[i] = sepia_r * 0.5 + r * 0.5;
                    data[i + 1] = sepia_g * 0.5 + g * 0.5;
                    data[i + 2] = sepia_b * 0.5 + b * 0.5;
                }
            }
        }

        // Retake photo
        function retakePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            video.style.display = 'block';
            canvas.style.display = 'none';
            
            document.getElementById('captureBtn').classList.remove('hidden');
            document.getElementById('captureBtn').disabled = false;
            document.getElementById('retakeBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('finishBtn').classList.add('hidden');
        }

        // Next photo
        function nextPhoto() {
            currentPhotoIndex++;
            document.getElementById('photoCount').textContent = `Photo ${currentPhotoIndex + 1} of 4`;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            video.style.display = 'block';
            canvas.style.display = 'none';
            
            document.getElementById('captureBtn').classList.remove('hidden');
            document.getElementById('captureBtn').disabled = false;
            document.getElementById('retakeBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('finishBtn').classList.add('hidden');
            
            // Reset filter buttons
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => btn.classList.remove('active'));
            filterBtns[0].classList.add('active');
            applyFilter('none');
        }

        // Add sticker
        function addSticker(url) {
            const container = document.getElementById('cameraContainer');
            const stickerDiv = document.createElement('div');
            stickerDiv.className = 'sticker-overlay';
            stickerDiv.id = `sticker-${stickerCounter++}`;
            stickerDiv.style.width = '100px';
            stickerDiv.style.height = '100px';
            stickerDiv.style.left = '50%';
            stickerDiv.style.top = '50%';
            stickerDiv.style.transform = 'translate(-50%, -50%) rotate(0deg)';
            
            stickerDiv.innerHTML = `
                <img src="${url}" draggable="false">
                <div class="sticker-controls">
                    <button class="sticker-control-btn delete-sticker" onclick="deleteSticker('${stickerDiv.id}')">✕</button>
                </div>
                <div class="resize-handle"></div>
            `;
            
            const stickerContainer = document.getElementById('stickerContainer');
            if (!stickerContainer) {
                const newContainer = document.createElement('div');
                newContainer.id = 'stickerContainer';
                newContainer.style.position = 'absolute';
                newContainer.style.top = '0';
                newContainer.style.left = '0';
                newContainer.style.width = '100%';
                newContainer.style.height = '100%';
                container.appendChild(newContainer);
            }
            
            document.getElementById('stickerContainer').appendChild(stickerDiv);
            makeDraggable(stickerDiv);
            makeResizable(stickerDiv);
        }

        // Make sticker draggable
        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            element.onmousedown = dragMouseDown;
            
            function dragMouseDown(e) {
                if (e.target.classList.contains('resize-handle') || 
                    e.target.classList.contains('sticker-control-btn')) {
                    return;
                }
                
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                activeSticker = element;
            }
            
            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                
                const currentTransform = element.style.transform;
                const rotateMatch = currentTransform.match(/rotate\(([^)]+)\)/);
                const rotation = rotateMatch ? rotateMatch[1] : '0deg';
                
                const newTop = (element.offsetTop - pos2);
                const newLeft = (element.offsetLeft - pos1);
                
                element.style.top = newTop + "px";
                element.style.left = newLeft + "px";
                element.style.transform = `rotate(${rotation})`;
            }
            
            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Make sticker resizable
        function makeResizable(element) {
            const resizeHandle = element.querySelector('.resize-handle');
            
            resizeHandle.onmousedown = function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const startX = e.clientX;
                const startY = e.clientY;
                const startWidth = element.offsetWidth;
                const startHeight = element.offsetHeight;
                
                function resize(e) {
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    const delta = Math.max(deltaX, deltaY);
                    
                    const newSize = Math.max(30, startWidth + delta);
                    element.style.width = newSize + 'px';
                    element.style.height = newSize + 'px';
                }
                
                function stopResize() {
                    document.removeEventListener('mousemove', resize);
                    document.removeEventListener('mouseup', stopResize);
                }
                
                document.addEventListener('mousemove', resize);
                document.addEventListener('mouseup', stopResize);
            };
        }

        // Delete sticker
        function deleteSticker(id) {
            document.getElementById(id).remove();
        }

        // Finish and create strip
        function finishStrip() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('stripPreview').classList.add('active');
            
            createPhotoStrip();
        }

        // Create photo strip
        function createPhotoStrip() {
            const stripCanvas = document.getElementById('stripCanvas');
            const ctx = stripCanvas.getContext('2d');
            
            // Strip dimensions (2x6 inch at 300 DPI)
            const dpi = 300;
            const stripWidth = 2 * dpi;  // 600px
            const stripHeight = 6 * dpi; // 1800px
            const border = 40;
            const photoPadding = 20;
            
            stripCanvas.width = stripWidth;
            stripCanvas.height = stripHeight;
            
            // White background
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, stripWidth, stripHeight);
            
            // Calculate photo dimensions
            const photoWidth = stripWidth - (2 * border);
            const photoHeight = (stripHeight - (2 * border) - (3 * photoPadding)) / 4;
            
            // Load and draw each photo
            let loadedPhotos = 0;
            photos.forEach((photo, index) => {
                if (photo && photo.dataUrl) {
                    const img = new Image();
                    img.onload = function() {
                        const y = border + (index * (photoHeight + photoPadding));
                        ctx.drawImage(img, border, y, photoWidth, photoHeight);
                        loadedPhotos++;
                        
                        // Add date/time stamp after all photos are loaded
                        if (loadedPhotos === photos.length) {
                            ctx.fillStyle = '#5a7a3c';
                            ctx.font = 'bold 18px Poppins';
                            ctx.textAlign = 'center';
                            const date = new Date().toLocaleDateString('en-US', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            });
                            ctx.fillText(date, stripWidth / 2, stripHeight - 15);
                        }
                    };
                    img.src = photo.dataUrl;
                }
            });
        }

        // Add sticker to strip
        function addStripSticker(url) {
            const container = document.getElementById('stripStickerContainer');
            const stickerDiv = document.createElement('div');
            stickerDiv.className = 'sticker-overlay';
            stickerDiv.id = `strip-sticker-${stripStickerCounter++}`;
            stickerDiv.style.width = '80px';
            stickerDiv.style.height = '80px';
            stickerDiv.style.left = '50%';
            stickerDiv.style.top = '50%';
            stickerDiv.style.transform = 'translate(-50%, -50%) rotate(0deg)';
            
            stickerDiv.innerHTML = `
                <img src="${url}" draggable="false">
                <div class="sticker-controls">
                    <button class="sticker-control-btn delete-sticker" onclick="deleteSticker('${stickerDiv.id}')">✕</button>
                </div>
                <div class="resize-handle"></div>
            `;
            
            container.appendChild(stickerDiv);
            makeDraggable(stickerDiv);
            makeResizable(stickerDiv);
        }

        // Download strip with stickers
        function downloadStripWithStickers() {
            const stripCanvas = document.getElementById('stripCanvas');
            const finalCanvas = document.createElement('canvas');
            const ctx = finalCanvas.getContext('2d');
            
            finalCanvas.width = stripCanvas.width;
            finalCanvas.height = stripCanvas.height;
            
            // Draw the strip
            ctx.drawImage(stripCanvas, 0, 0);
            
            // Draw stickers
            const stickers = document.querySelectorAll('#stripStickerContainer .sticker-overlay');
            const stripContainer = document.getElementById('stripStickerContainer');
            const stripRect = stripContainer.getBoundingClientRect();
            const canvasRect = stripCanvas.getBoundingClientRect();
            
            const scaleX = stripCanvas.width / canvasRect.width;
            const scaleY = stripCanvas.height / canvasRect.height;
            
            // Process stickers synchronously
            const stickerPromises = Array.from(stickers).map(sticker => {
                return new Promise((resolve) => {
                    const img = sticker.querySelector('img');
                    const rect = sticker.getBoundingClientRect();
                    
                    const x = (rect.left - canvasRect.left) * scaleX;
                    const y = (rect.top - canvasRect.top) * scaleY;
                    const width = rect.width * scaleX;
                    const height = rect.height * scaleY;
                    
                    const transform = sticker.style.transform;
                    const rotateMatch = transform.match(/rotate\(([^)]+)\)/);
                    const rotation = rotateMatch ? parseFloat(rotateMatch[1]) : 0;
                    
                    const tempImg = new Image();
                    tempImg.crossOrigin = 'anonymous';
                    tempImg.onload = function() {
                        ctx.save();
                        ctx.translate(x + width/2, y + height/2);
                        ctx.rotate(rotation * Math.PI / 180);
                        ctx.drawImage(tempImg, -width/2, -height/2, width, height);
                        ctx.restore();
                        resolve();
                    };
                    tempImg.onerror = function() {
                        resolve(); // Continue even if image fails
                    };
                    tempImg.src = img.src;
                });
            });
            
            Promise.all(stickerPromises).then(() => {
                const link = document.createElement('a');
                link.download = `cute-photobooth-strip-${Date.now()}.png`;
                link.href = finalCanvas.toDataURL('image/png');
                link.click();
            });
        }

        // Download strip (legacy function, redirects to new one)
        function downloadStrip() {
            downloadStripWithStickers();
        }

        // Start over
        function startOver() {
            currentPhotoIndex = 0;
            photos = [];
            currentFilter = 'none';
            stripStickerCounter = 0;
            
            document.getElementById('stripPreview').classList.remove('active');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('photoCount').textContent = 'Photo 1 of 4';
            
            // Clear strip stickers
            document.getElementById('stripStickerContainer').innerHTML = '';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                const captureBtn = document.getElementById('captureBtn');
                if (!captureBtn.classList.contains('hidden') && !captureBtn.disabled) {
                    e.preventDefault();
                    startCountdown();
                }
            }
        });
    </script>
